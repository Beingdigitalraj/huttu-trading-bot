name: Huttu Auto Trader (Windows Engine)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  trade_execution:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install MetaTrader5 & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5

      - name: Download and Install MT5 Terminal
        shell: powershell
        run: |
          curl.exe -k -sS -L -o mt5setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          if (Test-Path "mt5setup.exe") {
              Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/silent" -Wait
              Start-Sleep -Seconds 10
          } else {
              Write-Error "MT5 installer download failed."
              exit 1
          }

      - name: Execute Live MT5 Trade
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python bot_strategy.py
